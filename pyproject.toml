[project]
name = "iceberg-maintenance"
version = "0.3.0"
description = "Nightly Iceberg table maintenance (small-file compaction + snapshot expiry) for a FairTier box warehouse"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # EXACT pin, not a floor. compact-time we drive a PyIceberg-internal
    # (underscore) helper, `_dataframe_to_data_files`, to stream a rewrite in
    # chunks — safe ONLY because the version is frozen, so internals can't
    # shift under it. Bump deliberately (and revisit the internal import) — see
    # the AWAITING-UPSTREAM note in maintenance.py.
    "pyiceberg[pyarrow]==0.11.1",
    # Imported directly (maintenance.py builds the streamed chunks and releases
    # the arena between tables). Provided transitively by pyiceberg[pyarrow]
    # above; declared here because we import it by name. Left unpinned so uv
    # resolves it inside pyiceberg's own constraint.
    "pyarrow",
    # Observability (src/iceberg_maintenance/telemetry.py). Only the API is
    # imported at module scope; the SDK, the exporter and the requests
    # instrumentation are imported lazily and only on a box that has a
    # collector. OTLP over HTTP, not gRPC, to keep grpcio wheels (and their
    # arm64 build) out of the image.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-requests>=0.51b0",
]

[project.urls]
Homepage = "https://github.com/fairtier/iceberg-maintenance"
Repository = "https://github.com/fairtier/iceberg-maintenance"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iceberg_maintenance"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "sqlalchemy>=2.0",
    "ty>=0.0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ty.environment]
extra-paths = ["src"]
